[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-oxylabs-web-api"
version = "0.1.1"
description = "Oxylabs Web API search and page extraction provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oxylabs", email = "giedrius.stankauskas@oxylabs.io" }]
keywords = ["hermes-agent", "plugin", "oxylabs", "web-search", "web-scraping", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["httpx>=0.27,<1"]

[project.entry-points."hermes_agent.plugins"]
oxylabs-web-api = "hermes_oxylabs_web_api"

[project.urls]
Homepage = "https://github.com/oxylabs/hermes-oxylabs-web-api"
Repository = "https://github.com/oxylabs/hermes-oxylabs-web-api"
Issues = "https://github.com/oxylabs/hermes-oxylabs-web-api/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1", "twine>=6.1,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_oxylabs_web_api = ["plugin.yaml", "py.typed"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls the real Oxylabs Web API and needs OXYLABS_WEB_API_KEY"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
