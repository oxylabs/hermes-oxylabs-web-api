name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  live:
    name: Live test against the Oxylabs Web API
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked --dev
      - env:
          OXYLABS_WEB_API_KEY: ${{ secrets.OXYLABS_WEB_API_KEY }}
        run: |
          if [ -z "$OXYLABS_WEB_API_KEY" ]; then echo "OXYLABS_WEB_API_KEY secret not set; skipping."; exit 0; fi
          uv run pytest -m live

  package:
    name: Build and check distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: Test the built wheel
        run: uv run --isolated --no-project --with 'pytest>=8.3,<10' --with 'pytest-asyncio>=0.24,<2' --with ./dist/*.whl pytest
